[project]
name = "marketreview"
version = "0.1.0"
description = "marketReview using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.14.5a2"
]

[project.scripts]
marketreview = "marketreview.main:run"
run_crew = "marketreview.main:run"
train = "marketreview.main:train"
replay = "marketreview.main:replay"
test = "marketreview.main:test"
run_with_trigger = "marketreview.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
